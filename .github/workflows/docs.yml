name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'publish/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'publish/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Setup symlinks
        run: |
          cd publish
          ./scripts/setup-book-links.sh

      - name: Build book
        run: |
          cd publish/book
          mdbook build

      - name: Upload book artifact
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: publish/dist/book

  build-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: |
          pip install mkdocs-material

      - name: Setup symlinks
        run: |
          cd publish
          ./scripts/setup-website-links.sh

      - name: Build website
        run: |
          cd publish/website
          mkdocs build --site-dir ../dist/website

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: publish/dist/website

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-book, build-website]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download book artifact
        uses: actions/download-artifact@v4
        with:
          name: book
          path: dist/book

      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: website
          path: dist/website

      - name: Prepare combined site
        run: |
          # Website is the main site, book is available at /book/
          mkdir -p site
          cp -r dist/website/* site/
          mkdir -p site/book
          cp -r dist/book/* site/book/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify structure
        run: |
          cd publish
          ./scripts/verify-structure.sh
